<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeGrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true">+</span> LifeGrid <small>Emergency Response Network</small></div>
  <div class="badge-sim" role="note">SIMULATION · travel times are estimates, not real dispatch guidance</div>
  <button id="btn-reset" class="btn btn-ghost" type="button">Reset simulation</button>
</header>

<main class="layout">
  <aside class="panel sidebar" aria-label="Report emergency">
    <h2>Report emergency</h2>
    <form id="emergency-form">
      <label for="f-type">Type</label>
      <select id="f-type">
        <option value="CARDIAC">Cardiac</option>
        <option value="ACCIDENT">Accident</option>
        <option value="TRAUMA">Trauma</option>
        <option value="MINOR_INJURY">Minor injury</option>
      </select>
      <label for="f-sev">Severity: <b id="sev-val">5</b> / 10</label>
      <input id="f-sev" type="range" min="1" max="10" value="5">
      <label for="f-node">Location</label>
      <select id="f-node"></select>
      <p class="hint">Tip: click a node on the map to set the location.</p>
      <button class="btn btn-primary" type="submit">Dispatch ambulance</button>
    </form>
    <h3>Quick scenarios</h3>
    <div class="scenarios">
      <button class="btn" data-sc="multi" type="button">Multi-casualty accident</button>
      <button class="btn" data-sc="cardiac" type="button">Cardiac emergency</button>
      <button class="btn" data-sc="minor" type="button">Minor injury</button>
    </div>
  </aside>

  <section class="map-wrap" aria-label="Map"><div id="map"></div></section>

  <aside class="panel side-right" aria-label="Fleet and hospitals">
    <h2>Ambulances</h2><div id="amb-list" class="cards"></div>
    <h2>Hospitals</h2><div id="hos-list" class="cards"></div>
  </aside>

  <section class="panel bottom">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="log" role="tab">Dispatch log</button>
      <button class="tab" data-tab="reports" role="tab">Reports</button>
      <button id="btn-csv" class="btn btn-ghost right" type="button">Export CSV</button>
    </div>
    <div id="tab-log" class="tabpane"><table><thead><tr><th>#</th><th>Type</th><th>Severity</th><th>Status</th><th>Ambulance</th><th>Hospital</th><th>ETA (min)</th></tr></thead><tbody id="log-body"></tbody></table></div>
    <div id="tab-reports" class="tabpane" hidden>
      <div id="kpis" class="kpis"></div>
      <canvas id="chart" height="90"></canvas>
    </div>
  </section>
</main>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
